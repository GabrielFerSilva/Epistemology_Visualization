<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Trabalho de Epistemologia</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="timeline-toggle" type="button" aria-label="Mostrar ou ocultar barra superior">
        <img src="assets/icons/upperSlider.png" alt="Mostrar ou ocultar barra superior">
    </button>

    <div id="timeline">

        <div class="timeline-content">

            <button id="timeline-interval-toggle" type="button">⟷ Intervalo</button>

            <button id="timeline-play" type="button">▶ Iniciar</button>

            <span id="ano-min">1500</span>

            <input
                id="timeline-slider"
                type="range"
                min="1500"
                max="2025"
                value="2025"
                step="1"
            >

            <div id="timeline-interval-wrap" class="timeline-hidden">
                <input
                    id="timeline-slider-begin"
                    type="range"
                    min="1500"
                    max="2025"
                    value="1500"
                    step="1"
                >
                <input
                    id="timeline-slider-end"
                    type="range"
                    min="1500"
                    max="2025"
                    value="2025"
                    step="1"
                >
            </div>

            <span id="timeline-year">2025</span>

        </div>

    </div>

    <div id="container">

        <div id="grafo"></div>

        <div id="sidebar">
            <div id="conteudo-sidebar">
                <h2>Selecione algo</h2>
                <p>Clique em um nó ou aresta.</p>
            </div>
        </div>

    </div>

    <!-- dados -->
    <script src="dataset/epistemologists.js"></script>
    <script src="dataset/ideas.js"></script>
    <script src="dataset/idea_autor.js"></script>
    <script src="dataset/idea_idea.js"></script>
        
    <!-- script -->
    <script src="script.js"></script>

</body>
</html>
