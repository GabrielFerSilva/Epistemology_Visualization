<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Trabalho de Epistemologia</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="timeline-toggle" type="button" aria-label="Mostrar ou ocultar barra superior">
        <img src="assets/icons/upperSlider.png" alt="Mostrar ou ocultar barra superior">
    </button>

    <div id="author-filter-panel">
        <label for="author-filter-select">Filtrar por autor</label>
        <select id="author-filter-select">
            <option value="">Todos os autores</option>
        </select>
        
    </div>

        <div id="idea-filter-panel">
        <label for="idea-filter-select">Filtrar por ideia</label>
        <select id="idea-filter-select">
            <option value="">Todas as ideias</option>
        </select>
    </div>

    <button id="settings-toggle" type="button" aria-label="Configurações de exibição">⚙</button>

    <div id="settings-panel" class="panel-hidden">
        <h3>Configurações</h3>
        <label class="settings-row">
            <input type="checkbox" id="dark-mode-toggle">
            Modo escuro
        </label>
    </div>

    <button id="author-intersection-toggle" type="button" aria-label="Interseção entre autores">
        <img src="assets/icons/authorIntersection.png" alt="Interseção entre autores">
    </button>

    <div id="author-intersection-panel" class="panel-hidden">
        <h3>Interseção entre autores</h3>
        <p id="author-intersection-hint"></p>
        
        <div id="author-intersection-list"></div>
        
        <div class="author-intersection-actions">
            <button id="author-intersection-close" type="button">Limpar e Sair</button>
        </div>
    </div>

    <div id="timeline">

        <div class="timeline-content">

            <button id="timeline-interval-toggle" type="button">⟷ Intervalo</button>

            <button id="timeline-play" type="button">▶ Iniciar</button>

            <span id="ano-min">1500</span>

            <input
                id="timeline-slider"
                type="range"
                min="1500"
                max="2025"
                value="2025"
                step="1"
            >

            <div id="timeline-interval-wrap" class="timeline-hidden">
                <input
                    id="timeline-slider-begin"
                    type="range"
                    min="1500"
                    max="2025"
                    value="1500"
                    step="1"
                >
                <input
                    id="timeline-slider-end"
                    type="range"
                    min="1500"
                    max="2025"
                    value="2025"
                    step="1"
                >
            </div>

            <span id="timeline-year">2025</span>

        </div>

    </div>

    <div id="container">

        <div id="grafo"></div>

        <div id="sidebar">
            <div id="conteudo-sidebar">
            </div>
        </div>

    </div>

    <!-- dados -->
    <script src="dataset/epistemologists.js"></script>
    <script src="dataset/ideas.js"></script>
    <script src="dataset/idea_autor.js"></script>
    <script src="dataset/idea_idea.js"></script>
        
    <!-- script -->
    <script src="script.js"></script>

</body>
</html>
